<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TWD RPG • Refúgio</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-layout"><aside class="sidebar"><div class="sidebar-brand">TWD <span>RPG</span></div><nav><a href="../dashboard.html">▦ <span>Painel</span></a><a href="ficha.html">♟ <span>Personagem</span></a><a class="active" href="refugio.html">⌂ <span>Refúgio</span></a><a href="desafios.html">⚠ <span>Desafios</span></a><a href="viagem.html">⌖ <span>Viagem</span></a></nav><button class="logout" id="logout">Sair</button></aside>
<main class="content"><header class="topbar"><div><span class="eyebrow">FICHA DE REFÚGIO</span><h1>Seu refúgio</h1></div><div id="saveStatus" class="save-status">● Salvo</div></header>
<form id="refugeForm" class="form-stack"><section class="panel"><div class="form-grid three"><label>Nome<input name="nome"></label><label>Capacidade<input name="capacidade" type="number" min="0"></label><label>Defesa<input name="defesa" type="number" min="0"></label></div><label>Peculiaridades<textarea name="peculiaridades" rows="3"></textarea></label></section>
<section class="panel"><div class="section-heading"><div><span class="eyebrow">DESCRIÇÃO</span><h2>O local</h2></div></div><label>Resumo<textarea name="resumo" rows="3"></textarea></label><div class="form-grid two"><label>Estruturas<textarea name="estruturas" rows="5"></textarea></label><label>Arredores<textarea name="arredores" rows="5"></textarea></label></div><div class="form-grid two"><label>Fontes de Comida<textarea name="fontesComida" rows="5"></textarea></label><label>Equipamento Armazenado<textarea name="equipamentoArmazenado" rows="5"></textarea></label></div></section>
<section class="panel"><div class="section-heading"><div><span class="eyebrow">PROJETOS ATUAIS</span><h2>Projetos</h2></div></div><div id="projectRows" class="repeat-grid"></div></section>
<section class="panel"><div class="section-heading"><div><span class="eyebrow">PNJ SOBREVIVENTES</span><h2>Sobreviventes</h2></div></div><div id="npcRows" class="npc-grid"></div></section></form></main></div>
<script type="module" src="../js/refugio.js"></script></body></html>
